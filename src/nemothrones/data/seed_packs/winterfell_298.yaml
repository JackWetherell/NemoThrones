    summary: "Second son of Lord Rickard Stark, fostered at the Eyrie with Robert Baratheon under Jon Arryn. His father and elder brother Brandon were murdered by the Mad King, and Eddard fought beside Robert through the rebellion of 282–283 AC. He wed Catelyn Tully in Brandon's place and came home from the war with a bastard son, Jon Snow. He fought again in the Greyjoy Rebellion of 289 AC, after which Theon Greyjoy came to Winterfell as his ward. This morning he beheaded a deserter of the Night's Watch."
    skills: {martial: 15, diplomacy: 9, intrigue: 4, stewardship: 13, learning: 9, prowess: 14}
    possessions: ["Ice, the Valyrian steel greatsword of House Stark"]
    secrets: ["The truth of Jon Snow's birth, which you promised your dying sister Lyanna to keep. You have told no one, not even Catelyn."]
    ambitions: ["Keep the North safe and your family whole", "Raise your children to be just and true"]
    plans: ["See that the deserter's words about the Others are not spread to frighten the smallfolk"]
    knowledge:
