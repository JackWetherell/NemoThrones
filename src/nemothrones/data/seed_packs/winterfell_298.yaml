common_knowledge:
  - {subject: King Robert Baratheon, content: "Robert of House Baratheon, first of his name, sits the Iron Throne. He won it fifteen years ago in the rebellion against the Mad King, Aerys II Targaryen."}
  - {subject: The Hand of the King, content: "Lord Jon Arryn of the Eyrie has served as Hand of the King since the rebellion."}
  - {subject: Queen Cersei, content: "The queen is Cersei of House Lannister, daughter of Lord Tywin. She has given King Robert three children: Joffrey, Myrcella and Tommen."}
  - {subject: House Lannister, content: "Lord Tywin Lannister of Casterly Rock is the richest lord in the Seven Kingdoms. His son Ser Jaime of the Kingsguard slew the Mad King, and is called Kingslayer for it."}
  - {subject: The last Targaryens, content: "The Mad King's surviving children, Viserys and Daenerys, fled across the narrow sea as children; they are said to wander the Free Cities in exile."}
  - {subject: The Night's Watch, content: "The Night's Watch holds the Wall against the wildlings. A man who takes the black gives up lands, wife and children for life."}
  - {subject: The season, content: "Summer has lasted nearly ten years. The Citadel has not yet sent the white ravens to proclaim autumn."}
  - {subject: The Greyjoy Rebellion, content: "Nine years ago Balon Greyjoy rose against the king and was crushed. His last living son, Theon, was given to Lord Stark as ward and hostage."}

