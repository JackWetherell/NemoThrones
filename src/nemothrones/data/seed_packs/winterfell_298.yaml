# Winterfell, 298 AC: the hand-authored vertical-slice pack.
#
# Authored from canon knowledge of A Game of Thrones and A Wiki of Ice and Fire, for
# offline play and as the engine's test fixture. Birth years follow WOIAF where they
# are well established; skills, opinions, map coordinates and in-year dates are GAME
# ESTIMATES, not canon. When WOIAF is reachable, `nemothrones new --character ...
# --year 298` builds a generated era pack straight from the wiki instead.
#
# `fate` fields are Director-only: they are split off at seeding and never shown to
# agents, the narrator or the GM.

