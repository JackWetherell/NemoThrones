openings:
  eddard_stark:
    location: winterfell
    sublocation: the godswood
    present: []
    situation: "You sit on a stone beneath the great heart tree beside the black pool, cleaning Ice with oilcloth after this morning's execution of a Night's Watch deserter."
    hook: "Catelyn comes to you through the trees, picking her way among the roots; her face tells you she brings tidings."
    hook_arrivals: [catelyn_stark]
  catelyn_stark:
    location: winterfell
    sublocation: "Maester Luwin's turret"
    present: [maester_luwin]
    situation: "Maester Luwin has just read you the letter from King's Landing. Your husband is in the godswood, cleaning Ice after the morning's execution."
  jon_snow:
    location: winterfell
    sublocation: the yard
    present: [robb_stark, theon_greyjoy, arya_stark, rodrik_cassel]
    situation: "The yard rings with practice swords. Your albino pup sleeps against the wall, silent as ever. Ser Rodrik bellows at the boys."
