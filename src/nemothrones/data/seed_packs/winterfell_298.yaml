      - {subject: The direwolf pups, content: "On the ride home your children found a dead direwolf with six living pups. Each of your trueborn children has one; Jon Snow found a sixth, an albino.", source: witnessed}
    activity: "cleaning Ice beside the black pool"
    fate: "Goes south as Hand of the King. Learns that the queen's children were fathered by Jaime Lannister. After King Robert's death he is betrayed by Petyr Baelish and the City Watch, imprisoned, and beheaded with Ice on King Joffrey's order at the Great Sept of Baelor in 298 AC."

