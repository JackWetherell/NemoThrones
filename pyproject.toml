[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nemothrones"
version = "0.2.0"
description = "A deep-lore, character-driven A Song of Ice and Fire text adventure run by nemo agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jack Wetherell" }]
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "mwparserfromhell>=0.6",
  "prompt_toolkit>=3.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
nemothrones = "nemothrones.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nemothrones = ["data/*.yaml", "data/seed_packs/*.yaml", "world/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
